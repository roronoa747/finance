# Шаблон CI Vue 3 SPA (GitHub Actions, pnpm + vue-tsc + Vitest). Положить в
# .github/workflows/ci.yml репо фронта. Браузерная e2e-регрессия (Playwright,
# каталог e2e/) — отдельным job, когда набор появится.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build        # включает vue-tsc
      - run: pnpm vitest run
