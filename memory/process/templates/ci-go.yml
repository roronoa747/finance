# Шаблон CI Go-репо (GitHub Actions). Положить в .github/workflows/ci.yml
# репо бэкенда. Интеграционные тесты с БД — отдельным job с services: postgres,
# когда появятся (не заводить авансом).
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
