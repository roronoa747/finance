<title>Мечты: доводка</title>
<style>
/* Экраны 390 px парами «до | после»; тема снимков = тема страницы. */
:root {
  --bg: #F2F2F0; --surface: #FFFFFF; --ink: #1B1B1A; --ink-2: #5F5E5A; --brand: #B85A35; --line: #E2E1DC;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --show-l: block; --show-d: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121214; --surface: #1C1C1F; --ink: #F2F2F0; --ink-2: #A9A8A3; --brand: #E58A63; --line: #2C2C30;
  --show-l: none; --show-d: block; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121214; --surface: #1C1C1F; --ink: #F2F2F0; --ink-2: #A9A8A3; --brand: #E58A63; --line: #2C2C30;
  --show-l: none; --show-d: block; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--font); padding: 24px 16px 48px; }
main { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
h1 { font-size: 28px; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 6px 0 0; font-size: 15px; }
section { display: flex; flex-direction: column; gap: 14px; }
h2 { font-size: 20px; margin: 0; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
figcaption { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
figcaption.after { color: var(--brand); }
img { width: 100%; max-width: 390px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); }
.l { display: var(--show-l); } .d { display: var(--show-d); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap">

<main>
  <header>
    <h1>Мечты: доводка</h1>
    <p class="sub">Другие фото у своей мечты · купленное свёрнуто</p>
  </header>

  <section>
    <h2>Фото мечты</h2>
    <div class="pair">
      <figure><figcaption>До</figcaption>
        <img class="l" src="before-picker-light.jpg" alt="Лист «Фото мечты» до: только темы"><img class="d" src="before-picker-dark.jpg" alt="Лист «Фото мечты» до: только темы"></figure>
      <figure><figcaption class="after">После</figcaption>
        <img class="l" src="accept-picker-light.jpg" alt="Лист «Фото мечты» после: ряд фото темы над «Выбрать это»"><img class="d" src="accept-picker-dark.jpg" alt="Лист «Фото мечты» после: ряд фото темы над «Выбрать это»"></figure>
      <figure><figcaption class="after">Выбрали</figcaption>
        <img class="l" src="accept-hero-light.jpg" alt="Мечта с новым фото"><img class="d" src="accept-hero-dark.jpg" alt="Мечта с новым фото"></figure>
    </div>
  </section>

  <section>
    <h2>Уже купили</h2>
    <div class="pair">
      <figure><figcaption>До</figcaption>
        <img class="l" src="before-wishes-light.jpg" alt="Желания до: купленное раскрыто всегда"><img class="d" src="before-wishes-dark.jpg" alt="Желания до: купленное раскрыто всегда"></figure>
      <figure><figcaption class="after">После</figcaption>
        <img class="l" src="accept-wishes-light.jpg" alt="Желания после: «Уже купили · 2» свёрнуто"><img class="d" src="accept-wishes-dark.jpg" alt="Желания после: «Уже купили · 2» свёрнуто"></figure>
      <figure><figcaption class="after">Нажали</figcaption>
        <img class="l" src="accept-wishes-open-light.jpg" alt="Раскрыто: купленное и сумма"><img class="d" src="accept-wishes-open-dark.jpg" alt="Раскрыто: купленное и сумма"></figure>
    </div>
  </section>
</main>
