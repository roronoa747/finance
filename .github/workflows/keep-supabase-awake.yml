# Будильник для базы.
#
# Бесплатный проект Supabase ставится на паузу, если неделю не было обращений
# к базе. Для приложения, где принципиально не ведут ежедневные траты, это
# реальный сценарий: месяц не открывали — и оно мертво ровно тогда, когда
# понадобилось. Поэтому раз в сутки дёргаем базу лёгким запросом.
#
# Запрос идёт через само приложение (ML-10, мелочи): /api/health прода пингует
# Postgres (схема app — та же база Supabase). Ключи и файлы с адресами не нужны.
#
# Важно знать: GitHub отключает расписания в репозиториях, где 60 дней не было
# активности. Пока проект развивается, это не мешает. Если работа надолго
# затихнет — GitHub пришлёт письмо, и расписание нужно будет включить обратно
# кнопкой на вкладке Actions.

name: Будильник для базы

on:
  schedule:
    # 06:17 UTC — примерно полдень по Астане. Минуты не круглые намеренно:
    # в 00 минут у GitHub пик нагрузки и запуск может задержаться.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Разбудить базу
        run: |
          set -euo pipefail
          # -f: не 2xx — шаг красный. Прод — family-finance-ff (family-finance.vercel.app — чужой).
          body=$(curl -fsS --max-time 30 --retry 2 https://family-finance-ff.vercel.app/api/health)
          echo "Ответ: $body"

          # Ручка отвечает 200 и без базы — живость базы видна только в теле.
          case "$body" in
            *'"db":"connected"'*) echo "База отвечает, пауза не грозит" ;;
            *) echo "Приложение живо, а база нет — возможно, проект на паузе"; exit 1 ;;
          esac
