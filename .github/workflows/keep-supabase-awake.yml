# Будильник для базы.
#
# Бесплатный проект Supabase ставится на паузу, если неделю не было обращений
# к базе. Для приложения, где принципиально не ведут ежедневные траты, это
# реальный сценарий: месяц не открывали — и оно мертво ровно тогда, когда
# понадобилось. Поэтому раз в сутки дёргаем базу лёгким запросом.
#
# Ключ и адрес берутся из .env, который лежит в репозитории: он публичный,
# отдельные секреты заводить незачем.
#
# Важно знать: GitHub отключает расписания в репозиториях, где 60 дней не было
# активности. Пока проект развивается, это не мешает. Если работа надолго
# затихнет — GitHub пришлёт письмо, и расписание нужно будет включить обратно
# кнопкой на вкладке Actions.

name: Будильник для базы

on:
  schedule:
    # 06:17 UTC — примерно полдень по Астане. Минуты не круглые намеренно:
    # в 00 минут у GitHub пик нагрузки и запуск может задержаться.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Разбудить Supabase
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a

          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "В .env нет VITE_SUPABASE_URL"
            exit 1
          fi

          # Запрос доходит до Postgres, даже если политики не вернут ни строки —
          # для снятия паузы важно само обращение к базе, а не его результат.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
            -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            "${VITE_SUPABASE_URL}/rest/v1/households?select=id&limit=1")

          echo "Ответ: HTTP $code"
          head -c 300 /tmp/body || true
          echo

          # 200 — ответила, 401/403 — тоже ответила, просто не пустила.
          # Всё это значит, что проект живой. Плохо только молчание и 5xx.
          case "$code" in
            200|401|403|404) echo "База отвечает, пауза не грозит" ;;
            *) echo "Неожиданный ответ — возможно, проект на паузе"; exit 1 ;;
          esac
