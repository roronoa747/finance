# CI Vue 3 SPA — по шаблону memory/process/templates/ci-web.yml, адаптирован под
# npm (package-lock.json) и каталог frontend/. `npm test` идёт после сборки:
# e2e/pwa-build.test.ts проверяет собранный dist (манифест, sw.js).
name: ci-frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # как у проекта Vercel
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # включает vue-tsc
      - run: npm test
